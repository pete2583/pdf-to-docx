version: '3.8'

services:
  pdf-converter:
    build: .
    container_name: adobe-pdf-converter
    restart: unless-stopped
    environment:
      - ADOBE_CLIENT_ID=${ADOBE_CLIENT_ID}
      - ADOBE_CLIENT_SECRET=${ADOBE_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf-converter.entrypoints=https"
      - "traefik.http.routers.pdf-converter.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.pdf-converter.tls=true"
      - "traefik.http.routers.pdf-converter.tls.certresolver=http"
      - "traefik.http.services.pdf-converter.loadbalancer.server.port=8501"
      - "traefik.docker.network=proxy"
    networks:
      - default

networks:
  default:
    external:
      name: proxy
